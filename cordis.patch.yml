# Bundle layer: DSH loads this file automatically when dsh-plugin-memory is enabled.
# Do NOT copy its insert block into the profile's cordis.patch.yml: doing so
# duplicates entry IDs and prevents Settings from saving (issue #470).
# Keep profile overrides as top-level - id: memory rows. See the installation
# guide's "Settings cannot save after manual installation" recovery steps.
- insert:
    # Keep the v0.4 `memory` Entry as the public configuration target while
    # making every v0.5 component inherit its enabled state. The expression
    # reads the core row's own flag (rather than its effective state) to avoid
    # recursing through this ancestor gate. The group itself prepares the
    # Starter's dependency resolution before it imports its children.
    - id: memory-bundle
      name: dsh-plugin-memory/bundle
      group: true
      disabled: !!js >-
        ((entry) => entry.options.disabled?.__jsExpr
          ? Boolean(entry.evaluate(entry.options.disabled.__jsExpr))
          : Boolean(entry.options.disabled))
        ([...loader.entries()].find(entry => entry.options.id === 'memory'))
      config:
        - id: memory
          # Core/Host and default settings. Sources own their independent Entries.
          name: dsh-plugin-memory
          config:
            routingGuidance: true
            lifecycleEnabled: true
            recallMode: guided
            writebackMode: guided
            idleReviewMs: 30000
            tabEnabled: true
            writeEnabled: true
            remoteAccess: read-only
            timeoutMs: 10000
            defaultRecallLimit: 10
            embedding:
              enabled: false
              endpoint: http://localhost:11434
              model: nomic-embed-text
            recallQuality:
              policy: strict-v1
              lowScoreThreshold: 0.25
              highScoreThreshold: 0.6
              candidateMultiplier: 3
              maxMediumResults: 4
              maxRankedResults: 4
              maxUnknownResults: 2
        - id: memory-source-runtime
          name: dsh-plugin-memory-source-runtime
        - id: memory-source-documents
          name: dsh-plugin-memory-source-documents
        - id: memory-source-memory-spaces
          name: dsh-plugin-memory-source-memory-spaces
          config:
            # Every default Provider is an
            # explicit child. A custom parent composition may choose a subset.
            providers:
              - use: dsh-plugin-memory-provider-native
                instanceId: memory-native
              - use: dsh-plugin-memory-provider-openviking
                instanceId: openviking
              - use: dsh-plugin-memory-provider-honcho
                instanceId: honcho
              - use: dsh-plugin-memory-provider-mem0
                instanceId: mem0
              - use: dsh-plugin-memory-provider-hindsight
                instanceId: hindsight
              - use: dsh-plugin-memory-provider-holographic
                instanceId: holographic
              - use: dsh-plugin-memory-provider-retaindb
                instanceId: retaindb
              - use: dsh-plugin-memory-provider-byterover
                instanceId: byterover
              - use: dsh-plugin-memory-provider-supermemory
                instanceId: supermemory
        # Skills keep DSH's own files and their evolution data; the page lives
        # in the Memory System and nothing joins a model View.
        - id: memory-source-skills
          name: dsh-plugin-memory-source-skills
        # Strategies are part of the Memory System, not plugins of their own, so
        # a nested group keeps them out of the plugin inventory while their
        # Entry ids stay addressable from overrides and memoryView.strategyTypeId.
        - id: memory-strategies
          name: cordis:group
          group: true
          config:
            - id: memory-strategy-default-three-tier
              name: dsh-plugin-memory-strategy-default-three-tier
            # A second main Strategy; memoryView.strategyTypeId selects which
            # one composes the View. It stays off until selected.
            - id: memory-strategy-general
              name: dsh-plugin-memory-strategy-general
              disabled: true
            # v0.5 ships these narrowly scoped enhancements with the Starter so
            # the Settings switches are always available. They remain opt-in.
            - id: memory-strategy-auto-capture
              name: dsh-plugin-memory-strategy-auto-capture
              disabled: true
            - id: memory-strategy-light-context
              name: dsh-plugin-memory-strategy-light-context
              disabled: true
            - id: memory-strategy-scoped
              name: dsh-plugin-memory-strategy-scoped
              disabled: true
